---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arcadectl-controller
  namespace: arcadectl-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arcade.gobha.me
  resources:
  - gameservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - arcade.gobha.me
  resources:
  - gameservers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
