---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arcadectl-restore-worker-gate
  labels:
    app.kubernetes.io/name: arcadectl-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers
          - pods/resize
        scope: Namespaced
  variables:
    - name: isRestoreWorker
      expression: >-
        (has(object.metadata.labels) &&
         'app.kubernetes.io/managed-by' in object.metadata.labels &&
         'app.kubernetes.io/name' in object.metadata.labels &&
         object.metadata.labels['app.kubernetes.io/managed-by'] == 'arcadectl' &&
         object.metadata.labels['app.kubernetes.io/name'] == 'restore-worker') ||
        (has(object.metadata.ownerReferences) &&
         object.metadata.ownerReferences.exists(owner,
           owner.apiVersion == 'batch/v1' && owner.kind == 'Job' &&
           owner.name.startsWith('restore-'))) ||
        object.spec.serviceAccountName.startsWith('restore-') ||
        (oldObject != null && (
          (has(oldObject.metadata.labels) &&
           'app.kubernetes.io/managed-by' in oldObject.metadata.labels &&
           'app.kubernetes.io/name' in oldObject.metadata.labels &&
           oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'arcadectl' &&
           oldObject.metadata.labels['app.kubernetes.io/name'] == 'restore-worker') ||
          (has(oldObject.metadata.ownerReferences) &&
           oldObject.metadata.ownerReferences.exists(owner,
             owner.apiVersion == 'batch/v1' && owner.kind == 'Job' &&
             owner.name.startsWith('restore-'))) ||
          oldObject.spec.serviceAccountName.startsWith('restore-')))
    - name: newAuthorization
      expression: >-
        has(object.metadata.annotations) &&
        'arcade.gobha.me/restore-pod-authorized' in object.metadata.annotations
          ? object.metadata.annotations['arcade.gobha.me/restore-pod-authorized']
          : ''
    - name: oldAuthorization
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        'arcade.gobha.me/restore-pod-authorized' in oldObject.metadata.annotations
          ? oldObject.metadata.annotations['arcade.gobha.me/restore-pod-authorized']
          : ''
  validations:
    - expression: >-
        !variables.isRestoreWorker || !has(request.subResource) || request.subResource == ''
      message: Arcadectl restore worker Pod subresources are not mutable.
    - expression: >-
        !variables.isRestoreWorker || request.operation != 'CREATE' ||
        (has(object.spec.schedulingGates) &&
         size(object.spec.schedulingGates) == 1 &&
         object.spec.schedulingGates[0].name == 'arcade.gobha.me/restore-authorized' &&
         variables.newAuthorization == '' &&
         (!has(object.spec.nodeName) || object.spec.nodeName == ''))
      message: Arcadectl restore worker Pods must enter admission with exactly one execution gate and no authorization marker.
    - expression: >-
        !variables.isRestoreWorker || request.operation != 'UPDATE' ||
        (object.metadata.labels == oldObject.metadata.labels &&
         object.metadata.ownerReferences == oldObject.metadata.ownerReferences &&
         object.spec.containers == oldObject.spec.containers &&
         has(object.spec.initContainers) == has(oldObject.spec.initContainers) &&
         (!has(object.spec.initContainers) || object.spec.initContainers == oldObject.spec.initContainers) &&
         has(object.spec.activeDeadlineSeconds) == has(oldObject.spec.activeDeadlineSeconds) &&
         (!has(object.spec.activeDeadlineSeconds) || object.spec.activeDeadlineSeconds == oldObject.spec.activeDeadlineSeconds) &&
         has(object.spec.tolerations) == has(oldObject.spec.tolerations) &&
         (!has(object.spec.tolerations) || object.spec.tolerations == oldObject.spec.tolerations) &&
         has(object.spec.terminationGracePeriodSeconds) == has(oldObject.spec.terminationGracePeriodSeconds) &&
         (!has(object.spec.terminationGracePeriodSeconds) || object.spec.terminationGracePeriodSeconds == oldObject.spec.terminationGracePeriodSeconds) &&
         has(object.spec.nodeSelector) == has(oldObject.spec.nodeSelector) &&
         (!has(object.spec.nodeSelector) || object.spec.nodeSelector == oldObject.spec.nodeSelector) &&
         has(object.spec.affinity) == has(oldObject.spec.affinity) &&
         (!has(object.spec.affinity) || object.spec.affinity == oldObject.spec.affinity))
      message: Arcadectl restore worker executable fields are immutable while the scheduling gate is removed.
    - expression: >-
        !variables.isRestoreWorker || request.operation != 'UPDATE' ||
        (has(object.spec.schedulingGates) == has(oldObject.spec.schedulingGates) &&
         (!has(object.spec.schedulingGates) || object.spec.schedulingGates == oldObject.spec.schedulingGates) &&
         variables.newAuthorization == variables.oldAuthorization) ||
        (request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-controller' &&
         has(oldObject.spec.schedulingGates) &&
         size(oldObject.spec.schedulingGates) == 1 &&
         oldObject.spec.schedulingGates[0].name == 'arcade.gobha.me/restore-authorized' &&
         !has(object.spec.schedulingGates) &&
         variables.oldAuthorization == '' &&
         variables.newAuthorization == object.metadata.uid)
      message: Only the Arcadectl controller may authorize and remove the exact restore worker Pod gate.
