---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arcadectl-backup-worker-gate
  labels:
    app.kubernetes.io/name: arcadectl-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  policyName: arcadectl-backup-worker-gate
  validationActions:
    - Deny
  matchResources:
    matchPolicy: Equivalent
    objectSelector: {}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: arcadectl-system
