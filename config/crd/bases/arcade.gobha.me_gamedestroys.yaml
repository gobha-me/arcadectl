---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: gamedestroys.arcade.gobha.me
spec:
  group: arcade.gobha.me
  names:
    kind: GameDestroy
    listKind: GameDestroyList
    plural: gamedestroys
    shortNames:
    - gd
    singular: gamedestroy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.target.gameServer.name
      name: Server
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GameDestroy requests irreversible deletion of one exact retained
          world.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GameDestroySpec is an explicit, immutable destruction request. A client
              creates it without a confirmation, reads the controller-issued preview,
              then echoes the challenge once before its expiry. Cancellation is monotonic.
            properties:
              backupRef:
                description: |-
                  ExactLocalReference prevents name reuse from silently changing an
                  operation's subject. The containing operation namespace is implicit, so a
                  cross-namespace subject cannot be represented.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: |-
                      Namespace is a rejection sentinel, not a selector. Its presence is
                      forbidden so ordinary API requests cannot silently prune cross-namespace
                      intent; the operation namespace is always authoritative.
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: backupRef is immutable
                  rule: self == oldSelf
                - message: namespace must be omitted because references are local
                    to the operation
                  rule: '!has(self.namespace)'
              cancelRequested:
                default: false
                type: boolean
                x-kubernetes-validations:
                - message: cancelRequested cannot be cleared
                  rule: '!oldSelf || self'
              confirmationChallenge:
                description: |-
                  ConfirmationChallenge is the one-time echo of status.preview.challenge.
                  The controller must verify equality and expiry before deletion.
                maxLength: 128
                minLength: 16
                pattern: ^[A-Za-z0-9_-]+$
                type: string
              mode:
                description: |-
                  GameDestroyMode separates the backup-gated path from an explicitly unsafe
                  administrative exception. Admission must require a distinct administrator
                  identity and audit the latter; possession of a confirmation is not enough.
                enum:
                - VerifiedBackup
                - UnsafeNoBackup
                type: string
                x-kubernetes-validations:
                - message: destroy mode is immutable
                  rule: self == oldSelf
              repositorySecretRef:
                description: |-
                  ExactSecretReference pins an immutable Secret revision. Implementations must
                  also verify the live Secret has immutable=true before external work begins.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: |-
                      Namespace is a rejection sentinel, not a selector. Its presence is
                      forbidden so ordinary API requests cannot silently prune cross-namespace
                      intent; the operation namespace is always authoritative.
                    type: string
                  resourceVersion:
                    maxLength: 256
                    minLength: 1
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - resourceVersion
                - uid
                type: object
                x-kubernetes-validations:
                - message: repositorySecretRef is immutable
                  rule: self == oldSelf
                - message: namespace must be omitted because references are local
                    to the operation
                  rule: '!has(self.namespace)'
              target:
                description: |-
                  GameDestroyTarget pins the original server identity and the complete
                  retained-world claim set. The GameServer may already have been removed.
                properties:
                  data:
                    description: |-
                      RetainedDataReference is explicit authority to reattach one complete
                      retained data set. Identity must match every referenced claim's durable
                      data-identity label; Claims must cover every adapter-declared path exactly.
                    properties:
                      claims:
                        items:
                          description: |-
                            RetainedDataClaimReference pins one adapter path to one exact local PVC.
                            The namespace is always the containing GameServer namespace.
                          properties:
                            claimRef:
                              description: |-
                                ExactLocalReference prevents name reuse from silently changing an
                                operation's subject. The containing operation namespace is implicit, so a
                                cross-namespace subject cannot be represented.
                              properties:
                                name:
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                                  type: string
                                namespace:
                                  description: |-
                                    Namespace is a rejection sentinel, not a selector. Its presence is
                                    forbidden so ordinary API requests cannot silently prune cross-namespace
                                    intent; the operation namespace is always authoritative.
                                  type: string
                                uid:
                                  maxLength: 128
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              - uid
                              type: object
                              x-kubernetes-validations:
                              - message: namespace must be omitted because references
                                  are local to the operation
                                rule: '!has(self.namespace)'
                            path:
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                              type: string
                          required:
                          - claimRef
                          - path
                          type: object
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-map-keys:
                        - path
                        x-kubernetes-list-type: map
                      identity:
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - claims
                    - identity
                    type: object
                  game:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  gameServer:
                    description: |-
                      ExactLocalReference prevents name reuse from silently changing an
                      operation's subject. The containing operation namespace is implicit, so a
                      cross-namespace subject cannot be represented.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          Namespace is a rejection sentinel, not a selector. Its presence is
                          forbidden so ordinary API requests cannot silently prune cross-namespace
                          intent; the operation namespace is always authoritative.
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                    x-kubernetes-validations:
                    - message: namespace must be omitted because references are local
                        to the operation
                      rule: '!has(self.namespace)'
                required:
                - data
                - game
                - gameServer
                type: object
                x-kubernetes-validations:
                - message: destroy target is immutable
                  rule: self == oldSelf
                - message: retained claims must have unique names and UIDs
                  rule: self.data.claims.all(claim, self.data.claims.filter(other,
                    other.claimRef.name == claim.claimRef.name).size() == 1 && self.data.claims.filter(other,
                    other.claimRef.uid == claim.claimRef.uid).size() == 1)
              unsafeReason:
                description: |-
                  UnsafeReason is recorded for the separately authorized, audited override;
                  it must not contain credentials or unbounded narrative.
                maxLength: 256
                minLength: 8
                type: string
                x-kubernetes-validations:
                - message: unsafe reason is immutable
                  rule: self == oldSelf
            required:
            - cancelRequested
            - mode
            - target
            type: object
            x-kubernetes-validations:
            - message: verified destroy requires exact backup and repository references;
                unsafe destroy requires only a reason
              rule: 'self.mode == ''VerifiedBackup'' ? (has(self.backupRef) && has(self.repositorySecretRef)
                && !has(self.unsafeReason)) : (!has(self.backupRef) && !has(self.repositorySecretRef)
                && has(self.unsafeReason))'
            - message: confirmation challenge cannot be changed or cleared
              rule: '!has(oldSelf.confirmationChallenge) || (has(self.confirmationChallenge)
                && self.confirmationChallenge == oldSelf.confirmationChallenge)'
          status:
            description: GameDestroyStatus contains only bounded, controller-authored
              evidence.
            properties:
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletionJournal:
                items:
                  description: |-
                    GameDestroyClaimDeletion is a write-ahead journal entry for one exact PVC.
                    RequestedAt precedes a delete call; ObservedDeletedAt is set only after
                    absence of that exact UID is observed.
                  properties:
                    claimRef:
                      description: |-
                        ExactLocalReference prevents name reuse from silently changing an
                        operation's subject. The containing operation namespace is implicit, so a
                        cross-namespace subject cannot be represented.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                          type: string
                        namespace:
                          description: |-
                            Namespace is a rejection sentinel, not a selector. Its presence is
                            forbidden so ordinary API requests cannot silently prune cross-namespace
                            intent; the operation namespace is always authoritative.
                          type: string
                        uid:
                          maxLength: 128
                          minLength: 1
                          type: string
                      required:
                      - name
                      - uid
                      type: object
                      x-kubernetes-validations:
                      - message: namespace must be omitted because references are
                          local to the operation
                        rule: '!has(self.namespace)'
                    observedDeletedAt:
                      format: date-time
                      type: string
                    path:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$
                      type: string
                    requestedAt:
                      format: date-time
                      type: string
                  required:
                  - claimRef
                  - path
                  - requestedAt
                  type: object
                  x-kubernetes-validations:
                  - message: observed PVC deletion cannot be cleared or changed
                    rule: '!has(oldSelf.observedDeletedAt) || (has(self.observedDeletedAt)
                      && self.observedDeletedAt == oldSelf.observedDeletedAt)'
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: GameDestroyPhase is the bounded, observable destroy lifecycle.
                enum:
                - Pending
                - Preview
                - Verifying
                - Deleting
                - Succeeded
                - Failed
                - Cancelled
                type: string
              preview:
                description: |-
                  GameDestroyPreview provides a short-lived, controller-issued challenge and
                  restore guidance before any irreversible step.
                properties:
                  challenge:
                    maxLength: 128
                    minLength: 16
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                  expiresAt:
                    format: date-time
                    type: string
                  restoreGuidance:
                    maxLength: 1024
                    minLength: 1
                    type: string
                required:
                - challenge
                - expiresAt
                - restoreGuidance
                type: object
              startedAt:
                format: date-time
                type: string
              verification:
                description: |-
                  GameDestroyVerification proves that the exact requested artifact was
                  reverified in its repository while the target world remained cold.
                properties:
                  artifactID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  backupRef:
                    description: |-
                      ExactLocalReference prevents name reuse from silently changing an
                      operation's subject. The containing operation namespace is implicit, so a
                      cross-namespace subject cannot be represented.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          Namespace is a rejection sentinel, not a selector. Its presence is
                          forbidden so ordinary API requests cannot silently prune cross-namespace
                          intent; the operation namespace is always authoritative.
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                    x-kubernetes-validations:
                    - message: namespace must be omitted because references are local
                        to the operation
                      rule: '!has(self.namespace)'
                  coldAt:
                    description: |-
                      ColdAt records the last successful detached/cold observation. Controllers
                      must recheck this condition immediately before each destructive action.
                    format: date-time
                    type: string
                  manifestDigest:
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  pathCount:
                    format: int32
                    maximum: 16
                    minimum: 1
                    type: integer
                  repositorySecretRef:
                    description: |-
                      ExactSecretReference pins an immutable Secret revision. Implementations must
                      also verify the live Secret has immutable=true before external work begins.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$
                        type: string
                      namespace:
                        description: |-
                          Namespace is a rejection sentinel, not a selector. Its presence is
                          forbidden so ordinary API requests cannot silently prune cross-namespace
                          intent; the operation namespace is always authoritative.
                        type: string
                      resourceVersion:
                        maxLength: 256
                        minLength: 1
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - resourceVersion
                    - uid
                    type: object
                    x-kubernetes-validations:
                    - message: namespace must be omitted because references are local
                        to the operation
                      rule: '!has(self.namespace)'
                  verifiedAt:
                    format: date-time
                    type: string
                required:
                - artifactID
                - backupRef
                - coldAt
                - manifestDigest
                - pathCount
                - repositorySecretRef
                - verifiedAt
                type: object
            type: object
            x-kubernetes-validations:
            - message: preview challenge and guidance are immutable
              rule: '!has(oldSelf.preview) || (has(self.preview) && self.preview ==
                oldSelf.preview)'
            - message: verification evidence is immutable
              rule: '!has(oldSelf.verification) || (has(self.verification) && self.verification
                == oldSelf.verification)'
            - message: PVC deletion journal entries cannot be removed or retargeted
              rule: '!has(oldSelf.deletionJournal) || (has(self.deletionJournal) &&
                oldSelf.deletionJournal.all(entry, self.deletionJournal.exists(current,
                current.path == entry.path && current.claimRef == entry.claimRef &&
                current.requestedAt == entry.requestedAt)))'
            - message: terminal destroy phase cannot change
              rule: '!has(oldSelf.phase) || !(oldSelf.phase in [''Succeeded'', ''Failed'',
                ''Cancelled'']) || (has(self.phase) && self.phase == oldSelf.phase)'
            - message: successful destroy requires every journaled PVC to be observed
                deleted
              rule: '!has(self.phase) || self.phase != ''Succeeded'' || (has(self.deletionJournal)
                && self.deletionJournal.all(entry, has(entry.observedDeletedAt)))'
            - message: destroy cannot be cancelled after PVC deletion begins
              rule: '!has(self.phase) || self.phase != ''Cancelled'' || !has(self.deletionJournal)
                || self.deletionJournal.size() == 0'
            - message: destroy cannot fail terminally after PVC deletion begins
              rule: '!has(self.phase) || self.phase != ''Failed'' || !has(self.deletionJournal)
                || self.deletionJournal.size() == 0'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: confirmation must echo the controller-issued preview challenge
          rule: '!has(self.spec.confirmationChallenge) || (has(self.status) && has(self.status.preview)
            && self.spec.confirmationChallenge == self.status.preview.challenge)'
        - message: deletion requires the immutable preview challenge echoed in spec
          rule: '!has(self.status) || !has(self.status.phase) || !(self.status.phase
            in [''Deleting'', ''Succeeded'']) || (has(self.status.preview) && has(self.spec.confirmationChallenge)
            && self.spec.confirmationChallenge == self.status.preview.challenge)'
        - message: verified destroy requires matching complete repository proof
          rule: '!has(self.status) || !has(self.status.phase) || !(self.status.phase
            in [''Deleting'', ''Succeeded'']) || self.spec.mode != ''VerifiedBackup''
            || (has(self.status.verification) && self.status.verification.backupRef.name
            == self.spec.backupRef.name && self.status.verification.backupRef.uid
            == self.spec.backupRef.uid && self.status.verification.repositorySecretRef.name
            == self.spec.repositorySecretRef.name && self.status.verification.repositorySecretRef.uid
            == self.spec.repositorySecretRef.uid && self.status.verification.repositorySecretRef.resourceVersion
            == self.spec.repositorySecretRef.resourceVersion && self.status.verification.pathCount
            == self.spec.target.data.claims.size())'
        - message: PVC deletion journal must name only exact target claims
          rule: '!has(self.status) || !has(self.status.deletionJournal) || self.status.deletionJournal.all(entry,
            self.spec.target.data.claims.exists(claim, claim.path == entry.path &&
            claim.claimRef.name == entry.claimRef.name && claim.claimRef.uid == entry.claimRef.uid))'
        - message: successful destroy requires every target PVC in the deletion journal
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Succeeded'' || (has(self.status.deletionJournal) && self.status.deletionJournal.size()
            == self.spec.target.data.claims.size())'
        - message: cancellation cannot be newly requested after destroy completion
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || !(oldSelf.status.phase
            in [''Succeeded'', ''Failed'', ''Cancelled'']) || self.spec.cancelRequested
            == oldSelf.spec.cancelRequested'
        - message: cancellation cannot be newly requested after deletion begins
          rule: '!has(oldSelf.status) || !has(oldSelf.status.deletionJournal) || oldSelf.status.deletionJournal.size()
            == 0 || self.spec.cancelRequested == oldSelf.spec.cancelRequested'
        - message: repository verification is only available in verified-backup mode
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Verifying'' || self.spec.mode == ''VerifiedBackup'''
    served: true
    storage: true
    subresources:
      status: {}
