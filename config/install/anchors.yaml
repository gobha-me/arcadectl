              rule: '!has(oldSelf.phase) || !(oldSelf.phase in [''Succeeded'', ''Failed'',
                ''Cancelled'']) || (has(self.phase) && self.phase == oldSelf.phase)'
            - message: successful destroy requires every journaled PVC to be observed
                deleted
              rule: '!has(self.phase) || self.phase != ''Succeeded'' || (has(self.deletionJournal)
                && self.deletionJournal.all(entry, has(entry.observedDeletedAt)))'
            - message: destroy cannot be cancelled after PVC deletion begins
              rule: '!has(self.phase) || self.phase != ''Cancelled'' || !has(self.deletionJournal)
                || self.deletionJournal.size() == 0'
            - message: destroy cannot fail terminally after PVC deletion begins
              rule: '!has(self.phase) || self.phase != ''Failed'' || !has(self.deletionJournal)
                || self.deletionJournal.size() == 0'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: confirmation must echo the controller-issued preview challenge
          rule: '!has(self.spec.confirmationChallenge) || (has(self.status) && has(self.status.preview)
            && self.spec.confirmationChallenge == self.status.preview.challenge)'
        - message: deletion requires the immutable preview challenge echoed in spec
          rule: '!has(self.status) || !has(self.status.phase) || !(self.status.phase
            in [''Deleting'', ''Succeeded'']) || (has(self.status.preview) && has(self.spec.confirmationChallenge)
            && self.spec.confirmationChallenge == self.status.preview.challenge)'
        - message: verified destroy requires matching complete repository proof
          rule: '!has(self.status) || !has(self.status.phase) || !(self.status.phase
            in [''Deleting'', ''Succeeded'']) || self.spec.mode != ''VerifiedBackup''
            || (has(self.status.verification) && self.status.verification.backupRef.name
            == self.spec.backupRef.name && self.status.verification.backupRef.uid
            == self.spec.backupRef.uid && self.status.verification.repositorySecretRef.name
            == self.spec.repositorySecretRef.name && self.status.verification.repositorySecretRef.uid
            == self.spec.repositorySecretRef.uid && self.status.verification.repositorySecretRef.resourceVersion
            == self.spec.repositorySecretRef.resourceVersion && self.status.verification.pathCount
            == self.spec.target.data.claims.size())'
        - message: PVC deletion journal must name only exact target claims
          rule: '!has(self.status) || !has(self.status.deletionJournal) || self.status.deletionJournal.all(entry,
            self.spec.target.data.claims.exists(claim, claim.path == entry.path &&
            claim.claimRef.name == entry.claimRef.name && claim.claimRef.uid == entry.claimRef.uid))'
        - message: successful destroy requires every target PVC in the deletion journal
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Succeeded'' || (has(self.status.deletionJournal) && self.status.deletionJournal.size()
            == self.spec.target.data.claims.size())'
        - message: cancellation cannot be newly requested after destroy completion
          rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || !(oldSelf.status.phase
            in [''Succeeded'', ''Failed'', ''Cancelled'']) || self.spec.cancelRequested
            == oldSelf.spec.cancelRequested'
        - message: cancellation cannot be newly requested after deletion begins
          rule: '!has(oldSelf.status) || !has(oldSelf.status.deletionJournal) || oldSelf.status.deletionJournal.size()
            == 0 || self.spec.cancelRequested == oldSelf.spec.cancelRequested'
        - message: repository verification is only available in verified-backup mode
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Verifying'' || self.spec.mode == ''VerifiedBackup'''
    served: true
    storage: true
    subresources:
      status: {}
