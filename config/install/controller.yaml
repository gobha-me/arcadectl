apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arcadectl-backup-worker-gate
  labels:
    app.kubernetes.io/name: arcadectl-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - pods/ephemeralcontainers
          - pods/resize
        scope: Namespaced
  variables:
    - name: isBackupWorker
      expression: >-
        (has(object.metadata.labels) &&
         'app.kubernetes.io/managed-by' in object.metadata.labels &&
         'app.kubernetes.io/name' in object.metadata.labels &&
         object.metadata.labels['app.kubernetes.io/managed-by'] == 'arcadectl' &&
         object.metadata.labels['app.kubernetes.io/name'] == 'backup-worker') ||
        (has(object.metadata.ownerReferences) &&
         object.metadata.ownerReferences.exists(owner,
           owner.apiVersion == 'batch/v1' && owner.kind == 'Job' &&
           owner.name.startsWith('backup-'))) ||
        object.spec.serviceAccountName.startsWith('backup-')
    - name: newAuthorization
      expression: >-
        has(object.metadata.annotations) &&
        'arcade.gobha.me/backup-pod-authorized' in object.metadata.annotations
          ? object.metadata.annotations['arcade.gobha.me/backup-pod-authorized']
          : ''
    - name: oldAuthorization
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        'arcade.gobha.me/backup-pod-authorized' in oldObject.metadata.annotations
          ? oldObject.metadata.annotations['arcade.gobha.me/backup-pod-authorized']
          : ''
  validations:
    - expression: >-
        !variables.isBackupWorker || !has(request.subResource) || request.subResource == ''
      message: Arcadectl backup worker Pod subresources are not mutable.
    - expression: >-
        !variables.isBackupWorker || request.operation != 'CREATE' ||
        (has(object.spec.schedulingGates) &&
         size(object.spec.schedulingGates) == 1 &&
         object.spec.schedulingGates[0].name == 'arcade.gobha.me/backup-authorized' &&
         variables.newAuthorization == '' &&
         (!has(object.spec.nodeName) || object.spec.nodeName == ''))
      message: Arcadectl backup worker Pods must enter admission with exactly one execution gate and no authorization marker.
    - expression: >-
        !variables.isBackupWorker || request.operation != 'UPDATE' ||
        (object.spec.containers == oldObject.spec.containers &&
         has(object.spec.initContainers) == has(oldObject.spec.initContainers) &&
         (!has(object.spec.initContainers) || object.spec.initContainers == oldObject.spec.initContainers) &&
         has(object.spec.activeDeadlineSeconds) == has(oldObject.spec.activeDeadlineSeconds) &&
         (!has(object.spec.activeDeadlineSeconds) || object.spec.activeDeadlineSeconds == oldObject.spec.activeDeadlineSeconds) &&
         has(object.spec.tolerations) == has(oldObject.spec.tolerations) &&
         (!has(object.spec.tolerations) || object.spec.tolerations == oldObject.spec.tolerations) &&
         has(object.spec.terminationGracePeriodSeconds) == has(oldObject.spec.terminationGracePeriodSeconds) &&
         (!has(object.spec.terminationGracePeriodSeconds) || object.spec.terminationGracePeriodSeconds == oldObject.spec.terminationGracePeriodSeconds) &&
         has(object.spec.nodeSelector) == has(oldObject.spec.nodeSelector) &&
         (!has(object.spec.nodeSelector) || object.spec.nodeSelector == oldObject.spec.nodeSelector) &&
         has(object.spec.affinity) == has(oldObject.spec.affinity) &&
         (!has(object.spec.affinity) || object.spec.affinity == oldObject.spec.affinity))
      message: Arcadectl backup worker executable fields are immutable while the scheduling gate is removed.
    - expression: >-
        !variables.isBackupWorker || request.operation != 'UPDATE' ||
        (has(object.spec.schedulingGates) == has(oldObject.spec.schedulingGates) &&
         (!has(object.spec.schedulingGates) || object.spec.schedulingGates == oldObject.spec.schedulingGates) &&
         variables.newAuthorization == variables.oldAuthorization) ||
        (request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-controller' &&
         has(oldObject.spec.schedulingGates) &&
         size(oldObject.spec.schedulingGates) == 1 &&
         oldObject.spec.schedulingGates[0].name == 'arcade.gobha.me/backup-authorized' &&
         !has(object.spec.schedulingGates) &&
         variables.oldAuthorization == '' &&
         variables.newAuthorization == object.metadata.uid)
      message: Only the Arcadectl controller may authorize and remove the exact backup worker Pod gate.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arcadectl-backup-worker-gate
  labels:
    app.kubernetes.io/name: arcadectl-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  policyName: arcadectl-backup-worker-gate
  validationActions:
    - Deny
  matchResources:
    matchPolicy: Equivalent
    objectSelector: {}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: arcadectl-system
