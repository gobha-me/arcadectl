---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arcadectl-retained-world-pvc-delete
  labels:
    app.kubernetes.io/name: arcadectl-destroy-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["persistentvolumeclaims"]
      scope: Namespaced
  variables:
  - name: wasManagedWorld
    expression: >-
      oldObject != null && has(oldObject.metadata.labels) &&
      'app.kubernetes.io/managed-by' in oldObject.metadata.labels &&
      oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'arcadectl' &&
      'arcade.gobha.me/data-identity' in oldObject.metadata.labels &&
      'arcade.gobha.me/data-policy' in oldObject.metadata.labels &&
      oldObject.metadata.labels['arcade.gobha.me/data-policy'] == 'retain'
  - name: newColdBackupUID
    expression: >-
      object != null && has(object.metadata.annotations) &&
      'arcade.gobha.me/cold-backup-uid' in object.metadata.annotations
        ? object.metadata.annotations['arcade.gobha.me/cold-backup-uid'] : ''
  - name: oldColdBackupUID
    expression: >-
      oldObject != null && has(oldObject.metadata.annotations) &&
      'arcade.gobha.me/cold-backup-uid' in oldObject.metadata.annotations
        ? oldObject.metadata.annotations['arcade.gobha.me/cold-backup-uid'] : ''
  validations:
  - expression: >-
      request.operation != 'CREATE' || variables.newColdBackupUID == ''
    message: New PVCs cannot claim a verified cold-backup identity.
  - expression: >-
      request.operation != 'UPDATE' ||
      variables.newColdBackupUID == variables.oldColdBackupUID ||
      request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-controller'
    message: Only the ordinary Arcadectl controller may change a PVC cold-backup marker.
  - expression: >-
      !variables.wasManagedWorld || request.operation != 'DELETE' ||
      request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-destroy-controller'
    message: Only the dedicated Arcadectl destroy controller may delete a retained world PVC.
  - expression: >-
      !variables.wasManagedWorld || request.operation != 'UPDATE' ||
      (has(object.metadata.labels) &&
       ['app.kubernetes.io/managed-by', 'app.kubernetes.io/instance',
        'arcade.gobha.me/data-identity', 'arcade.gobha.me/data-policy',
        'arcade.gobha.me/data-path'].all(key,
          key in oldObject.metadata.labels && key in object.metadata.labels &&
          object.metadata.labels[key] == oldObject.metadata.labels[key]))
    message: Managed retained world PVC identity and retention labels cannot be changed or removed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arcadectl-retained-world-pvc-delete
  labels:
    app.kubernetes.io/name: arcadectl-destroy-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  policyName: arcadectl-retained-world-pvc-delete
  validationActions: [Deny]
  matchResources:
    matchPolicy: Equivalent
    objectSelector: {}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: arcadectl-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arcadectl-destroy-unsafe-admin
  labels:
    app.kubernetes.io/name: arcadectl-destroy-controller
    app.kubernetes.io/part-of: arcadectl
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
    - apiGroups: ["arcade.gobha.me"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["gamedestroys"]
      scope: Namespaced
  variables:
  - name: isUnsafe
    expression: >-
      object.spec.mode == 'UnsafeNoBackup' ||
      (oldObject != null && oldObject.spec.mode == 'UnsafeNoBackup')
  validations:
  - expression: >-
      !variables.isUnsafe ||
      request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-destroy-admin' ||
      (request.operation == 'UPDATE' && oldObject != null &&
       request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-destroy-controller' &&
       object.spec == oldObject.spec)
    message: Unsafe no-backup destroy requires the distinct Arcadectl destroy admin identity.
  - expression: >-
      !variables.isUnsafe ||
      (has(object.metadata.annotations) &&
       'arcade.gobha.me/unsafe-requested-by' in object.metadata.annotations &&
       object.metadata.annotations['arcade.gobha.me/unsafe-requested-by'] ==
         'system:serviceaccount:arcadectl-system:arcadectl-destroy-admin' &&
       (oldObject == null ||
        (has(oldObject.metadata.annotations) &&
         'arcade.gobha.me/unsafe-requested-by' in oldObject.metadata.annotations &&
         object.metadata.annotations['arcade.gobha.me/unsafe-requested-by'] ==
           oldObject.metadata.annotations['arcade.gobha.me/unsafe-requested-by'])))
    message: Unsafe destroy must retain its immutable administrator audit identity annotation.
  auditAnnotations:
  - key: unsafe-destroy-target-uid
    valueExpression: >-
      object.spec.mode == 'UnsafeNoBackup' ? string(object.spec.target.gameServer.uid) : ''
---
