       has(object.spec.nodeSelector) == has(oldObject.spec.nodeSelector) &&
       (!has(object.spec.nodeSelector) || object.spec.nodeSelector == oldObject.spec.nodeSelector) &&
       has(object.spec.affinity) == has(oldObject.spec.affinity) &&
       (!has(object.spec.affinity) || object.spec.affinity == oldObject.spec.affinity))
    message: Arcadectl destroy worker executable fields are immutable while the scheduling gate is removed.
  - expression: >-
      !variables.isDestroyWorker || request.operation != 'UPDATE' ||
      (has(object.spec.schedulingGates) == has(oldObject.spec.schedulingGates) &&
       (!has(object.spec.schedulingGates) || object.spec.schedulingGates == oldObject.spec.schedulingGates) &&
       variables.newAuthorization == variables.oldAuthorization) ||
      (request.userInfo.username == 'system:serviceaccount:arcadectl-system:arcadectl-destroy-controller' &&
       has(oldObject.spec.schedulingGates) && size(oldObject.spec.schedulingGates) == 1 &&
       oldObject.spec.schedulingGates[0].name == 'arcade.gobha.me/destroy-authorized' &&
       !has(object.spec.schedulingGates) && variables.oldAuthorization == '' &&
       variables.newAuthorization == object.metadata.uid)
    message: Only the dedicated Arcadectl destroy controller may authorize the exact destroy worker Pod.
---
