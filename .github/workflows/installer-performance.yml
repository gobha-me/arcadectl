name: Kind CPU quota comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-cpu-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cpu-diagnostic:
    name: Native Kind CPU quota comparison
    runs-on: ubuntu-24.04
    # Four serial legs retain their unchanged 35-minute Go budgets.
    timeout-minutes: 150
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test diagnostic bounds, ownership and numeric privacy with race detection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          diagnostic_pattern='^TestKindCPUResourceDiagnostic'
          diagnostic_listing=$(go test -race -tags=kindinstall -p 1 -list "$diagnostic_pattern" ./internal/installengine)
          mapfile -t diagnostic_roots < <(printf '%s\n' "$diagnostic_listing" | awk '/^Test[^[:space:]]*$/' | LC_ALL=C sort)
          if [[ ${#diagnostic_roots[@]} -ne 10 ]]; then
            echo 'Expected ten compiled CPU diagnostic controls; refusing an incomplete gate.' >&2
            exit 1
          fi
          printf 'CPU diagnostic control roots: %s\n' "${diagnostic_roots[@]}"
          go test -race -tags=kindinstall -p 1 -timeout=5m -v ./internal/installengine -run "$diagnostic_pattern" -count=1
      - name: Compare unchanged native baseline on owned two- and three-CPU nodes
        env:
          ARCADECTL_KIND_CPU_DIAGNOSTICS: "1"
        shell: bash
        run: |
          set -euo pipefail
          for arc_cpu_pair in 1:2 2:3 3:3 4:2; do
            IFS=: read -r arc_cpu_arm arc_cpu_quota <<< "$arc_cpu_pair"
            export ARCADECTL_KIND_CPU_QUOTA="$arc_cpu_quota"
            printf 'kind-cpu-arm index=%s quota=%s begin\n' "$arc_cpu_arm" "$arc_cpu_quota"
            /usr/bin/time -f "kind-cpu-arm index=$arc_cpu_arm quota=$arc_cpu_quota elapsed-seconds=%e user-seconds=%U system-seconds=%S max-rss-kib=%M exit=%x" make test-kind-install-precontroller INSTALL_PRECONTROLLER_PROFILE=137
          done

# Experiment only: no required CI family, proof, command, profile, timeout or
# cadence is replaced. Four serial legs on one runner compare only the owned
# node's 2-versus-3 CPU quota, in both orders. Its 3 GiB memory/swap, 2048 PIDs,
# registry limits and every proof remain unchanged. Default CI stays at 2 CPUs.
# Build/cache/order effects remain; this is not full signed-CI speedup proof.
# Only exact-owned-node read-only counters and host numeric CPU totals are
# observed. No raw profile artifact,
# extra runner type, paid capacity or Captain deployment is introduced.
# Whole-fixture counters and overlapping throttling time are not exclusive
# proof-phase attribution, lost wall time or causal speedup evidence.
