name: Installer FS hash screen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-fs-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    name: Serial whole local guard hash screen
    if: github.ref == 'refs/heads/perf/issue-89-fs-hash-screen' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 512MiB
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare four finite whole local guard samples
        run: python3 -I hack/fs-hash-screen/screen.py
