name: Installer performance lab

on:
  push:
    branches: [perf/installer-ci-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  descriptor-membership:
    name: Fresh authorization catalog controls (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - &restore-go-cache
        name: Restore Go module and build cache (read only)
        id: go-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Verify fresh request ownership and complete catalog refusals
        shell: bash
        run: |
          set -euo pipefail
          controls_shard='${{ matrix.shard }}'
          [[ "$controls_shard" =~ ^[0-5]$ ]] || exit 2
          controls_pattern='^(TestBaselineDenied.*|TestBaselineConfigurationLists.*|TestAdmissionConfiguration.*|TestAdmissionNamedCatalog.*|TestBootstrapAdmissionClosedProviderBracketsWholeObservationAndProbes|TestLifecycleConvergenceAdmissionWaitsForOriginalPolicyStatus|TestColdBoundProviderBracketsWorldPolicyAndJournalIdentity|TestBaselineActorsRequireOriginalAuthorityAndCloseEachProbe|TestActivationEpoch.*|TestInstallerAdmissionCIProfilesAndFailClosedRequiredGate)$'
          controls_listing=$(go test -race -tags=kindinstall -p 1 -list "$controls_pattern" ./internal/installengine)
          mapfile -t controls_all < <(printf '%s\n' "$controls_listing" | awk '/^Test[^[:space:]]*$/' | LC_ALL=C sort)
          if [[ ${#controls_all[@]} -eq 0 ]]; then
            echo 'No compiled control roots selected; refusing an empty lab gate.' >&2
            exit 1
          fi
          mapfile -t controls_selected < <(printf '%s\n' "${controls_all[@]}" | awk -v shard="$controls_shard" '(NR - 1) % 6 == shard')
          if [[ ${#controls_selected[@]} -eq 0 ]]; then
            echo 'No control roots assigned to this shard; refusing an empty lab gate.' >&2
            exit 1
          fi
          printf 'Installer performance controls shard %s/6: %s of %s compiled selected roots\n' "$controls_shard" "${#controls_selected[@]}" "${#controls_all[@]}"
          printf 'Selected: %s\n' "${controls_selected[@]}"
          controls_union=''
          for controls_name in "${controls_selected[@]}"; do
            controls_union+="${controls_union:+|}^${controls_name}$"
          done
          go test -race -tags=kindinstall -p 1 -failfast -timeout=15m -v ./internal/installengine -run "$controls_union" -count=1

  descriptor-measurements:
    name: Fresh catalog measurements and vet
    needs: [descriptor-membership]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *restore-go-cache
      - name: Compare complete configuration and descriptor membership costs
        run: go test -p 1 -timeout=3m ./internal/installengine -run '^$' -bench '^(BenchmarkBaselineDeniedDescriptorMembership|BenchmarkAdmissionConfiguration.*)$' -benchmem -benchtime=250ms -count=3
      - name: Vet the changed engine and its test harness
        run: go vet -tags=kindinstall -p 1 ./internal/installengine

  phase-barriers:
    name: Complete read-only phase and durability controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *restore-go-cache
      - name: Verify complete passes, original closures and local durability with race detection
        run: go test -race -tags=kindinstall -p 1 -timeout=15m -v ./internal/installengine -run '^(TestFixturePhase(ReadBarrier.*|NamedScan.*|ReadPass.*|PublicOriginalDrift.*|FinalActorRead.*|OriginalWarmRenewal.*|WarmRenewalCompletedFloor.*)|TestFixtureV3.*)$' -count=1

  native-configuration:
    name: Native v3 cold matrix (${{ matrix.revision }})
    needs: [descriptor-measurements, phase-barriers]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        revision: [before, candidate]
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact comparison revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'before' && '5e3347840153a2d9ad2fccf9571cce36bbe0b49c' || github.sha }}
      - name: Resolve exact pinned Kind node images
        id: kind-images
        env:
          CI_KIND_PROFILE: '137'
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import os
          import re
          from pathlib import Path

          try:
              source = Path("internal/installengine/target_auth_kind_test.go").read_text()
              images = {}
              for profile in ("135", "137"):
                  image, = re.findall(r'const targetKind' + profile + r' = "([^"\n]+)"', source)
                  if not re.fullmatch(r"kindest/node:v[0-9.]+@sha256:[0-9a-f]{64}", image):
                      raise ValueError("node image is not statically pinned")
                  images[profile] = image
              # These independent harnesses must agree before sharing a cache.
              api = Path("internal/install/api_kind_test.go").read_text()
              lifecycle = Path("hack/test-kind-lifecycle.sh").read_text()
              if (f'const apiKindNode = "{images["137"]}"' not in api
                      or f"readonly kind_node_image='{images['137']}'" not in lifecycle):
                  raise ValueError("independent node image pins differ")
              profile = os.environ["CI_KIND_PROFILE"]
              selected = [images[p] for p in (("135", "137") if profile == "both" else (profile,))]
              refs = " ".join(selected)
              digest = hashlib.sha256(refs.encode()).hexdigest()
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"valid=true\nimages={refs}\nkey={digest}\n")
          except Exception:
              print("::notice::Cannot statically determine exact node pins; harness will pull normally")
          PYCODE
      - name: Restore pinned Kind node image tarball (read only)
        id: kind-cache
        if: steps.kind-images.outputs.valid == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/kind-node-images.tar
          key: kind-node-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.kind-images.outputs.key }}
      - name: Load pinned Kind node images
        if: steps.kind-images.outputs.valid == 'true'
        env:
          KIND_IMAGES: ${{ steps.kind-images.outputs.images }}
          KIND_TARBALL: ${{ runner.temp }}/kind-node-images.tar
        run: |
          if [[ -f "$KIND_TARBALL" ]]; then
            docker load --input "$KIND_TARBALL" || echo '::warning::Node tarball load failed; falling back to pinned pulls'
          fi
          read -r -a images <<< "$KIND_IMAGES"
          for image in "${images[@]}"; do
            # Legacy Docker archives can lose RepoDigests. A digest pull then
            # restores registry metadata, reusing the layers just loaded.
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              docker pull "$image"
            fi
          done
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *restore-go-cache
      - name: Run the complete unmodified native matrix on an owned disposable cluster
        run: make test-kind-install-admission-v3 INSTALL_ADMISSION_PROFILE=137 INSTALL_ADMISSION_MODE=cold

# This bounded experiment does not replace any required CI job or certify
# whole-lifecycle speedup. The complete signed lifecycle remains in CI.
