name: Kind CPU resource diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-cpu-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cpu-diagnostic:
    name: Native Kind CPU resource diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test diagnostic bounds, ownership and numeric privacy with race detection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          diagnostic_pattern='^TestKindCPUResourceDiagnostic'
          diagnostic_listing=$(go test -race -tags=kindinstall -p 1 -list "$diagnostic_pattern" ./internal/installengine)
          mapfile -t diagnostic_roots < <(printf '%s\n' "$diagnostic_listing" | awk '/^Test[^[:space:]]*$/' | LC_ALL=C sort)
          if [[ ${#diagnostic_roots[@]} -eq 0 ]]; then
            echo 'No compiled CPU diagnostic controls; refusing an empty gate.' >&2
            exit 1
          fi
          printf 'CPU diagnostic control roots: %s\n' "${diagnostic_roots[@]}"
          go test -race -tags=kindinstall -p 1 -timeout=5m -v ./internal/installengine -run "$diagnostic_pattern" -count=1
      - name: Measure unchanged native baseline on its owned two-CPU node
        env:
          ARCADECTL_KIND_CPU_DIAGNOSTICS: "1"
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'kind-cpu-native elapsed-seconds=%e user-seconds=%U system-seconds=%S max-rss-kib=%M exit=%x' make test-kind-install-precontroller INSTALL_PRECONTROLLER_PROFILE=137

# Experiment only: no required CI family, proof, command, profile, timeout or
# cadence is replaced. The existing node stays at 2 CPUs, 3 GiB memory/swap and
# 2048 PIDs; registry limits are unchanged. Only exact-owned-node read-only
# counters and host numeric CPU totals are observed. No raw profile artifact,
# extra runner type, paid capacity or Captain deployment is introduced.
# Whole-fixture counters and overlapping throttling time are not exclusive
# proof-phase attribution, lost wall time or causal speedup evidence.
