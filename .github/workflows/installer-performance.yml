name: Installer performance lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-reader-performance-${{ github.ref }}
  cancel-in-progress: true

# One hosted runner, four SERIAL component proofs; no required CI changes.
# The job budget covers four unchanged 35-minute proof budgets plus controls.
jobs:
  metadata-readers:
    name: Native metadata reader comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Check out exact unchanged baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9856b313bde3f856c8c70513eb9035dd18c3f527
          path: baseline
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache: true
          cache-dependency-path: candidate/go.sum
      - name: Refuse source or dependency drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C baseline rev-parse HEAD)" = 9856b313bde3f856c8c70513eb9035dd18c3f527
          cmp baseline/go.mod candidate/go.mod
          cmp baseline/go.sum candidate/go.sum
          cmp baseline/.github/workflows/ci.yml candidate/.github/workflows/ci.yml
          cmp baseline/Makefile candidate/Makefile
          cmp baseline/internal/installengine/target_auth_kind_test.go candidate/internal/installengine/target_auth_kind_test.go
          cmp baseline/internal/installengine/baseline_prerequisites_kind_test.go candidate/internal/installengine/baseline_prerequisites_kind_test.go
      - name: Race-test complete metadata and receipt controls
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          metadata_controls='^TestBaseline(Metadata.*|Original.*|Parent.*|AccessEightLanes.*)$'
          metadata_listing=$(go test -race -tags=kindinstall -p 1 -list "$metadata_controls" ./internal/installengine)
          mapfile -t metadata_roots < <(printf '%s\n' "$metadata_listing" | awk '/^Test[[:alnum:]_]+$/')
          test "${#metadata_roots[@]}" -ge 18
          for metadata_required in \
            TestBaselineMetadataFixedAddressDomain \
            TestBaselineMetadataOriginalPendingStates \
            TestBaselineMetadataSignedRoleUpgradeRollback \
            TestBaselineOriginalReceiptIndependentOwnersAndReleasedRefusal \
            TestBaselineOriginalReceiptRepeatedReplacementAndFailureRelease \
            TestBaselineParentIndependentReceiptOwnersPreserveWholeEvidence \
            TestBaselineOriginalAccessHistoricalModesKeepVerifiedGuardClosed \
            TestBaselineAccessEightLanesPreserveWholeMembershipAndClosingJoin \
            TestBaselineAccessEightLanesCancelAndJoinEveryRefusedSibling \
            TestBaselineAccessEightLanesCallerCancellationJoinsEveryReader \
            TestBaselineAccessEightLanesFreezeAllSignedEntriesBeforeReads \
            TestBaselineAccessEightLanesCloseLateProtectedFileFence \
            TestBaselineMetadataWholeProvider \
            TestBaselineOriginalParentsPendingIdentityNotReadiness \
            TestBaselineOriginalParentPrivateRouteRefusesNonInstallationKeys \
            TestBaselineOriginalParentSignedUpgradeRollbackAndQuiescence \
            TestBaselineMetadataEightLanesKeepBothCompletePasses \
            TestBaselineMetadataEightLanesRefusalAndCancellationJoinBeforeRelease; do
            printf '%s\n' "${metadata_roots[@]}" | grep -Fxq "$metadata_required"
          done
          printf 'Metadata controls: %s compiled roots\n' "${#metadata_roots[@]}"
          printf 'Selected: %s\n' "${metadata_roots[@]}"
          go test -race -tags=kindinstall -p 1 -timeout=15m -v ./internal/installengine -run "$metadata_controls" -count=1
          go vet -tags=kindinstall -p 1 ./internal/installengine
      - name: Compare unchanged native proof in both orders
        shell: bash
        run: |
          set -euo pipefail
          metadata_arm_index=0
          for metadata_revision in baseline candidate candidate baseline; do
            metadata_arm_index=$((metadata_arm_index + 1))
            case "$metadata_revision" in
              baseline) metadata_root="$GITHUB_WORKSPACE/baseline" ;;
              candidate) metadata_root="$GITHUB_WORKSPACE/candidate" ;;
              *) exit 2 ;;
            esac
            printf 'Metadata comparison arm %s revision=%s\n' "$metadata_arm_index" "$metadata_revision"
            /usr/bin/time -f "metadata-reader-arm index=$metadata_arm_index revision=$metadata_revision wall=%e user=%U system=%S rss-kib=%M exit=%x" \
              make -C "$metadata_root" test-kind-install-precontroller INSTALL_PRECONTROLLER_PROFILE=137
          done

# This manual component experiment does not replace any required CI proof.
# Native proof/profile/timeouts and owned Kind resource limits remain unchanged.
# Build/cache/order/time effects remain; this is not full signed-CI speedup proof.
