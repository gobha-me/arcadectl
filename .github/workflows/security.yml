name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...

  gitleaks:
    name: Full history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified gitleaks release
        run: |
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$install_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$install_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
      - name: Scan full history with redaction
        run: |
          report="$RUNNER_TEMP/gitleaks-report.json"
          status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --report-path "$report" --report-format json --exit-code 1 || status=$?
          if [ -f "$report" ]; then
            echo "Gitleaks redacted report (rule, file, commit only):"
            if [ "$(jq 'length' "$report")" = "0" ]; then
              echo "no findings"
            else
              jq -c '.[] | {rule: .RuleID, file: .File, commit: .Commit}' "$report"
            fi
            {
              echo "### Gitleaks redacted report"
              echo
              echo "Fields: rule, file, commit. Secret values are not included."
              echo
              if [ "$(jq 'length' "$report")" = "0" ]; then
                echo "no findings"
              else
                jq -r '.[] | "- rule: \(.RuleID)  file: \(.File)  commit: \(.Commit)"' "$report"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
