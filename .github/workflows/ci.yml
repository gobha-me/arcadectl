name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-pipeline-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-pipeline-foundation:
    name: Request pipeline recorder foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test recorder privacy isolation and disabled overhead
        run: |
          go test -race -p 1 -timeout=2m ./internal/installengine -run='^TestRequestPipeline' -count=3
          printf '%s\n' 'arcadectl-request-pipeline-race-v1-complete'
      - name: Vet the tagged engine and diagnostic consumers
        run: |
          go vet -tags=kindinstall -p 1 ./internal/installengine
          printf '%s\n' 'arcadectl-request-pipeline-vet-v1-complete'
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
