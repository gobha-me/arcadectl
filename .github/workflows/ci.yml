name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-install-auth:
    name: Kind installer native authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove closed native authentication on both supported kubelets
        run: make test-kind-install-auth

  kind-api:
    name: Kind authenticated admin API
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove isolated authenticated API and HTTP Factorio lifecycle
        run: make test-kind-api

  kind-recovery:
    name: Kind recovery failure safety
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove real Factorio recovery and isolated failure safety
        env:
          GOMAXPROCS: "2"
          GOMEMLIMIT: 1GiB
        run: make test-kind-recovery
      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kind-recovery/
          if-no-files-found: ignore
          retention-days: 3

  install-engine-race:
    name: Installer engine race shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Discover and run every assigned race test
        run: bash ./hack/test-installengine-race-shard.sh '${{ matrix.shard }}'

  go-and-policy:
    name: Go and policy
    needs: install-engine-race
    # Do not turn failed/cancelled dependencies into a skipped passing gate.
    # Whole-workflow cancellation can cancel this gate too; it is never green.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Require every installer engine race shard
        env:
          ENGINE_RACE_RESULT: ${{ needs.install-engine-race.result }}
        run: test "$ENGINE_RACE_RESULT" = success
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated API artifacts
        run: make verify-generated
      - name: Verify pinned runtime assets
        run: make verify-runtime-assets
      - name: Vet
        run: go vet -p 1 ./...
      - name: Test with race detector
        run: |
          discovered=$(go list ./...)
          mapfile -t packages < <(printf '%s\n' "$discovered" | awk '$0 != "github.com/gobha-me/arcadectl/internal/installengine"')
          test "${#packages[@]}" -gt 0
          go test -race -p 1 -timeout=15m "${packages[@]}"
      - name: Test API-server lifecycle transitions
        run: make test-envtest
      - name: Build reproducible controller image
        run: |
          for tag in first second; do
            docker build --no-cache \
              --build-arg VCS_REF="$(git rev-parse HEAD)" \
              --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
              --tag "arcadectl-controller:ci-$tag" \
              .
          done
          first_id=$(docker image inspect --format '{{.Id}}' arcadectl-controller:ci-first)
          second_id=$(docker image inspect --format '{{.Id}}' arcadectl-controller:ci-second)
          if [ "$first_id" != "$second_id" ]; then
            docker image inspect arcadectl-controller:ci-first arcadectl-controller:ci-second \
              --format 'id={{.Id}} created={{.Created}} layers={{json .RootFS.Layers}}'
            echo "Independent clean builds produced different controller images" >&2
            exit 1
          fi
      - name: Build and inspect reproducible API image
        run: |
          for tag in first second; do
            docker build --no-cache --file Dockerfile.api \
              --build-arg VCS_REF="$(git rev-parse HEAD)" \
              --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
              --tag "arcadectl-api:ci-$tag" .
          done
          first_id=$(docker image inspect --format '{{.Id}}' arcadectl-api:ci-first)
          second_id=$(docker image inspect --format '{{.Id}}' arcadectl-api:ci-second)
          test "$first_id" = "$second_id"
          test "$(docker image inspect --format '{{.Config.User}}' arcadectl-api:ci-first)" = '65532:65532'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' arcadectl-api:ci-first)" = '["/arcadectl-api"]'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' arcadectl-api:ci-first)" = "$(git rev-parse HEAD)"

  kind-lifecycle:
    name: Kind lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove isolated-cluster lifecycle
        run: make test-kind-lifecycle
      - name: Prove certified Factorio lifecycle
        run: make test-kind-factorio
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kind-lifecycle/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload sanitized Factorio lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factorio-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/factorio-lifecycle/
          if-no-files-found: ignore
          retention-days: 3
