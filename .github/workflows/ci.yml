name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-light-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  light:
    name: Go light PR check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOFLAGS: -p=2
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -p 2 ./...
      - name: Fast unit tests
        run: go test -p 2 -timeout=5m -count=1 ./internal/adminauth ./internal/admincredential ./internal/receiptid ./internal/catalog
      - name: Vet fast unit packages
        run: go vet -p 2 ./internal/adminauth ./internal/admincredential ./internal/receiptid ./internal/catalog
