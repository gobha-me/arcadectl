name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-gate-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post-gate-validation:
    name: Supplemental exact-BB4 post-dependency Go and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact delivery candidate, not validation workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bb4a20313f3d122762d8f468eabf7749d23effc4
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require clean exact delivery source
        run: |
          test "$(git rev-parse HEAD)" = bb4a20313f3d122762d8f468eabf7749d23effc4
          test "$(git rev-parse HEAD^{tree})" = 89c3c0f46e5ae587ab24069d312a316193129e06
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf '%s\n' 'post-gate-delivery-source-v1'
      - name: Verify module
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated API artifacts
        run: make verify-generated
      - name: Verify pinned runtime assets
        run: make verify-runtime-assets
      - name: Vet
        run: go vet -p 1 ./...
      - name: Test with race detector
        run: |
          discovered=$(go list ./...)
          mapfile -t packages < <(printf '%s\n' "$discovered" | awk '$0 != "github.com/gobha-me/arcadectl/internal/installengine"')
          test "${#packages[@]}" -gt 0
          go test -race -p 1 -timeout=15m "${packages[@]}"
      - name: Test API-server lifecycle transitions
        run: make test-envtest
      - name: Build reproducible controller image
        run: |
          for tag in first second; do
            docker build --no-cache \
              --build-arg VCS_REF="$(git rev-parse HEAD)" \
              --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
              --tag "arcadectl-controller:ci-$tag" \
              .
          done
          first_id=$(docker image inspect --format '{{.Id}}' arcadectl-controller:ci-first)
          second_id=$(docker image inspect --format '{{.Id}}' arcadectl-controller:ci-second)
          if [ "$first_id" != "$second_id" ]; then
            docker image inspect arcadectl-controller:ci-first arcadectl-controller:ci-second \
              --format 'id={{.Id}} created={{.Created}} layers={{json .RootFS.Layers}}'
            echo "Independent clean builds produced different controller images" >&2
            exit 1
          fi
      - name: Build and inspect reproducible API image
        run: |
          for tag in first second; do
            docker build --no-cache --file Dockerfile.api \
              --build-arg VCS_REF="$(git rev-parse HEAD)" \
              --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
              --tag "arcadectl-api:ci-$tag" .
          done
          first_id=$(docker image inspect --format '{{.Id}}' arcadectl-api:ci-first)
          second_id=$(docker image inspect --format '{{.Id}}' arcadectl-api:ci-second)
          test "$first_id" = "$second_id"
          test "$(docker image inspect --format '{{.Config.User}}' arcadectl-api:ci-first)" = '65532:65532'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' arcadectl-api:ci-first)" = '["/arcadectl-api"]'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' arcadectl-api:ci-first)" = "$(git rev-parse HEAD)"
      - name: Require unchanged exact delivery source after all checks
        run: |
          test "$(git rev-parse HEAD)" = bb4a20313f3d122762d8f468eabf7749d23effc4
          test "$(git rev-parse HEAD^{tree})" = 89c3c0f46e5ae587ab24069d312a316193129e06
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf '%s\n' 'post-gate-checks-complete-v1'
