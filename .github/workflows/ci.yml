name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-and-policy:
    name: Go and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated API artifacts
        run: make verify-generated
      - name: Verify pinned runtime assets
        run: make verify-runtime-assets
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Test API-server lifecycle transitions
        run: make test-envtest
      - name: Build reproducible controller image
        run: |
          for tag in first second; do
            docker build --no-cache \
              --build-arg VCS_REF="$(git rev-parse HEAD)" \
              --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
              --tag "arcadectl-controller:ci-$tag" \
              .
          done
          first_id=$(docker image inspect --format '{{.Id}}' arcadectl-controller:ci-first)
          second_id=$(docker image inspect --format '{{.Id}}' arcadectl-controller:ci-second)
          test "$first_id" = "$second_id"

  kind-lifecycle:
    name: Kind lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove isolated-cluster lifecycle
        run: make test-kind-lifecycle
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kind-lifecycle/
          if-no-files-found: ignore
          retention-days: 3
