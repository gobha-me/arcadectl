name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denied-lookup-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  denied-lookup-prototype:
    name: Denied catalog immutable lookup prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: off
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require compiled correctness and benchmark roots
        shell: bash
        run: |
          set -euo pipefail
          go test -p=1 -list '^(TestBaselineDeniedLookupPrototypeParity|BenchmarkBaselineDeniedLookupPrototype)$' ./internal/installengine > "$RUNNER_TEMP/denied-lookup-discovery.txt"
          test "$(awk '/^TestBaselineDeniedLookupPrototypeParity$/ {n++} END {print n+0}' "$RUNNER_TEMP/denied-lookup-discovery.txt")" = 1
          test "$(awk '/^BenchmarkBaselineDeniedLookupPrototype$/ {n++} END {print n+0}' "$RUNNER_TEMP/denied-lookup-discovery.txt")" = 1
          test "$(awk '/^(Test|Benchmark)/ {n++} END {print n+0}' "$RUNNER_TEMP/denied-lookup-discovery.txt")" = 2
          echo denied-lookup-prototype-discovery-complete-v1
      - name: Race check exact prototype parity three times
        shell: bash
        run: |
          set -euo pipefail
          go test -p=1 -race -count=3 -timeout=10m -run '^TestBaselineDeniedLookupPrototypeParity$' ./internal/installengine
          echo denied-lookup-prototype-race-complete-v1
      - name: Benchmark unchanged lookup queries in both fixed orders
        shell: bash
        run: |
          set -euo pipefail
          go test -p=1 -run '^$' -bench '^BenchmarkBaselineDeniedLookupPrototype$' -benchmem -benchtime=200x -count=5 -cpu=2 -timeout=15m ./internal/installengine
          echo denied-lookup-prototype-bench-complete-v1
      - name: Vet unchanged engine with prototype tests
        shell: bash
        run: |
          set -euo pipefail
          go vet -p=1 ./internal/installengine
          echo denied-lookup-prototype-vet-complete-v1
      - name: Require unchanged exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo denied-lookup-prototype-source-complete-v1
