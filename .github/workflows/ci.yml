name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-component-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-component-profile:
    name: One native V3 warm component measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test frozen and native-only profiling boundaries
        run: go test -race -p 1 -timeout=3m ./hack/profile-installer-wrappers -count=1
      - name: Vet the measurement tool
        run: go vet -p 1 ./hack/profile-installer-wrappers
      - name: Test unchanged observer and test-only parser candidate
        run: go test -race -p 1 -timeout=8m ./internal/installobserve -count=1
      - name: Differential fuzz test-only parser against unchanged oracle
        run: go test -p 1 ./internal/installobserve -run='^$' -fuzz='^FuzzNoGraphCandidateMatchesBoundedJSON$' -fuzztime=20s -parallel=1 -timeout=3m
      - name: Benchmark paired whole public JSON validation
        run: go test -p 1 ./internal/installobserve -run='^$' -bench='^BenchmarkPublicJSONWholeValidation$' -benchmem -benchtime=300ms -count=5 -timeout=5m
      - name: Profile one complete native component without raw artifacts
        run: go run -p 1 ./hack/profile-installer-wrappers native-component-v2 '${{ github.sha }}'
