name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-baseline-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm-baseline-diagnostics:
    name: Warm native baseline refusal diagnostics
    runs-on: ubuntu-24.04
    # Includes added unit-race/vet setup; the original native proof remains48m.
    # This diagnostic run is not required-PR, release or lifecycle acceptance.
    timeout-minutes: 60
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test warm baseline diagnostic order and closed labels
        run: go test -race -p 1 -timeout=2m ./internal/installengine -run='^TestWarmInitialBaselineDiagnosticOrderingAndClosedStages$' -count=1
      - name: Vet unchanged native provider and diagnostic consumer
        run: go vet -tags=kindinstall -p 1 ./internal/installengine
      - name: Prove original native authentication and inert fixtures on both profiles
        run: make test-kind-install-auth
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
