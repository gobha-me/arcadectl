name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-component-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pure-candidate-comparison:
    name: Public parser and CRD normalization comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test unchanged production and test-only candidates
        run: go test -race -p 1 -timeout=8m ./internal/installobserve ./internal/installcontract -count=1
      - name: Vet unchanged production and test-only candidates
        run: go vet -p 1 ./internal/installobserve ./internal/installcontract
      - name: Report bounded eligibility of all signed CRDs
        run: go test -p 1 ./internal/installcontract -run='^TestCRDShallowBorrowMatchesAllSignedSchemas$' -count=1 -v -timeout=3m
      - name: Differential fuzz both public JSON candidates
        run: go test -p 1 ./internal/installobserve -run='^$' -fuzz='^FuzzNoGraphCandidateMatchesBoundedJSON$' -fuzztime=60s -parallel=1 -timeout=3m
      - name: Differential fuzz complete CRD normalization
        run: go test -p 1 ./internal/installcontract -run='^$' -fuzz='^FuzzCRDShallowBorrowMatchesDeepCopy$' -fuzztime=30s -parallel=1 -timeout=2m
      - name: Benchmark paired whole public JSON validation
        run: go test -p 1 ./internal/installobserve -run='^$' -bench='^(BenchmarkPublicJSONWholeValidation|BenchmarkPublicJSONRejectedBudget)$' -benchmem -benchtime=300ms -count=5 -timeout=5m
      - name: Benchmark complete signed CRD normalization
        run: go test -p 1 ./internal/installcontract -run='^$' -bench='^BenchmarkCRDSpecWholeNormalization$' -benchmem -benchtime=200ms -count=5 -timeout=5m
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
