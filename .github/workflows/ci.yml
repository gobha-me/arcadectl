name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-component-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crd-check-copy-validation:
    name: Private CRD check ownership validation and native measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test complete default-build contract package and owning results
        run: go test -race -p 1 -timeout=8m ./internal/installcontract -count=1
      - name: Race test native diagnostic controls
        run: go test -race -p 1 -timeout=2m ./hack/profile-installer-wrappers -count=1
      - name: Vet CRD ownership and tagged installer consumers
        run: go vet -tags=kindinstall -p 1 ./internal/installcontract ./internal/installengine ./hack/profile-installer-wrappers
      - name: Differential fuzz complete CRD operations
        run: go test -p 1 ./internal/installcontract -run='^$' -fuzz='^FuzzCRDCheckCopyWholeOperations$' -fuzztime=30s -parallel=2 -timeout=3m
      # 240 cases x five repetitions, both orders; stable and every-call churn.
      # Compare corrected-owning copies, not the historical defective copy.
      # This is synthetic complete-method timing, not a lifecycle deadline test.
      - name: Benchmark paired complete CRD operations in both orders
        run: go test -p 1 ./internal/installcontract -run='^$' -bench='^BenchmarkCRDCheckCopyWholeOperations(Reverse)?$' -benchmem -benchtime=200ms -count=5 -timeout=12m
      - name: Profile one complete native component without raw artifacts
        run: go run -p 1 ./hack/profile-installer-wrappers native-component-v2 '${{ github.sha }}'
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
