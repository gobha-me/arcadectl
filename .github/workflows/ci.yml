name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-component-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-construction-validation:
    name: Immutable image construction validation and native measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test signed value accessors and defensive copies
        run: go test -race -p 1 -timeout=8m ./internal/installrender -count=1
      # Preserve every selected complete tree; the combined suite exceeded one
      # 8m package timer. Existing race weights guide placement, not runtime bounds.
      - name: Race test constructor and fixture cohort 1 of 4
        run: go test -race -p 1 -timeout=8m ./internal/installengine -run='^(TestAdmissionCreateProbeMetadataMembershipAndIndependentResults|TestFixturePhaseColdLeaderTailMetadataRemainsExact|TestFixturePhaseDestroyShapeUsesDestroyFamilyNotOrdinaryWarmth|TestFixturePhaseNamedScanClosesEveryRemoteOriginalWitness|TestFixtureRecipeRefusesUnknownOwnersClosedLedgerAndAlteredEvidence|TestFixtureRecipeV2OriginalWirePreviewAckDeleteAndAbsence|TestFixtureResultRefusesExecutionBindingAndStatusAuthority)$' -count=1
      - name: Race test constructor and fixture cohort 2 of 4
        run: go test -race -p 1 -timeout=8m ./internal/installengine -run='^(TestFixturePhaseCompleteOriginalAndFixedFixtureAccounting|TestFixturePhaseNamedScanKeepsPerGETAuthorizationAndLocalEvidence|TestFixturePhasePublicOriginalDriftIncludingSecondPassTail|TestFixturePhaseRejectsLegacyWorldOnlyCompanion|TestFixtureRecipeV2BehaviorVersionRequiresAllOriginals|TestFixtureRecipeV2CompletePhaseAndHistoricalRetirement|TestFixtureResultClosedPhasesOriginalOwnershipAndWholeShape|TestFixtureResultReloadKeepsOriginalOwnershipAndNoSendCapability)$' -count=1
      - name: Race test constructor and fixture cohort 3 of 4
        run: go test -race -p 1 -timeout=8m ./internal/installengine -run='^(TestFixturePhaseOriginalWarmRenewalBoundsAndFloors|TestFixturePhaseOriginalWarmRenewalClosure|TestFixturePhaseStateReadabilityDoesNotRepairUnknownAcknowledgements|TestFixturePhaseWarmRenewalCompletedFloorSurvivesLaterRefusal|TestFixturePhaseWarmRenewalUnrelatedLeaseWholeClosure|TestFixtureRecipeClosedInertObjectsAndOriginalOwner|TestFixtureRecipeV2ClosedVerifiedOriginalAndWholeShapes|TestLifecycleBoundaryDiagnosticActualRefusalsPreserveEffects)$' -count=1
      - name: Race test constructor and fixture cohort 4 of 4
        run: go test -race -p 1 -timeout=8m ./internal/installengine -run='^(TestFixturePhaseFinalActorReadCannotHideProtectedFileReplacement|TestFixturePhaseLeaderRefreshWholeGCAndMonotonicTypedFloor|TestFixturePhaseOriginalWarmRenewalIdentity|TestFixturePhaseReadPassKeepsCompleteCollectionsAndNativeRefusals|TestFixtureRecipeV1UnusedCompositionTailRefused|TestFixtureRecipeVersionsAreClosedAndImmutable|TestFixtureResultIndependentNativeMetadataTimes)$' -count=1
      - name: Race test native diagnostic controls
        run: go test -race -p 1 -timeout=2m ./hack/profile-installer-wrappers -count=1
      - name: Vet immutable image access and tagged installer harness
        run: go vet -tags=kindinstall -p 1 ./internal/installrender ./internal/installengine ./hack/profile-installer-wrappers
      - name: Benchmark paired complete probe constructors
        run: go test -p 1 ./internal/installengine -run='^$' -bench='^BenchmarkAdmissionCreateProbeImages$' -benchmem -benchtime=300ms -count=5 -timeout=5m
      - name: Profile one complete native component without raw artifacts
        run: go run -p 1 ./hack/profile-installer-wrappers native-component-v2 '${{ github.sha }}'
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
