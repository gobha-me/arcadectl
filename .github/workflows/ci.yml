name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-oracle-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-oracle:
    name: Required workflow contract and six early diagnostic roots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: off
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
    steps:
      - name: Check out exact validation source and delivery parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require exact delivery source for workflow oracle
        run: |
          test "$(git rev-parse HEAD^2)" = bb4a20313f3d122762d8f468eabf7749d23effc4
          test "$(git diff --name-only bb4a20313f3d122762d8f468eabf7749d23effc4 HEAD)" = .github/workflows/ci.yml
          git restore --source=bb4a20313f3d122762d8f468eabf7749d23effc4 --worktree -- .github/workflows/ci.yml
          git diff --exit-code bb4a20313f3d122762d8f468eabf7749d23effc4 -- .
          test "$(git hash-object .github/workflows/ci.yml)" = "$(git rev-parse bb4a20313f3d122762d8f468eabf7749d23effc4:.github/workflows/ci.yml)"
          printf '%s\n' 'workflow-oracle-delivery-source-v1'
      - name: Race check workflow contract without tags
        run: |
          go test -v -race -p 1 -timeout=5m ./internal/installengine -run '^TestInstallerAdmissionCIProfilesAndFailClosedRequiredGate$' -count=1
          printf '%s\n' 'workflow-oracle-untagged-complete-v1'
      - name: Race check all six tagged early diagnostic roots
        run: |
          go test -v -race -tags=kindinstall -p 1 -timeout=5m ./internal/installengine -run '^(TestInstallerAdmissionCIProfilesAndFailClosedRequiredGate|TestInstallerBinaryProgressCapture|TestInstallerBinaryRequestPipelineCapture|TestInstallerBinaryParentContext|TestLifecycleCostsBoundedCommandAndInvocationIsolation|TestLifecycleCostsConcurrentRefusalsAndCancellation)$' -count=1
          printf '%s\n' 'workflow-oracle-six-tagged-complete-v1'
      - name: Require unchanged delivery bytes and restore validation workflow
        run: |
          git diff --exit-code bb4a20313f3d122762d8f468eabf7749d23effc4 -- .
          test -z "$(git ls-files --others --exclude-standard)"
          git restore --source=HEAD --worktree -- .github/workflows/ci.yml
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf '%s\n' 'workflow-oracle-source-complete-v1'
