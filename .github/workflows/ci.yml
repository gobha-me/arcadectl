name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parent-context-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parent-context-diagnostics:
    name: Installer parent-context closed diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test real process cancellation and closed parent observations
        run: go test -race -tags=kindinstall -p 1 -timeout=3m ./internal/installengine -run='^(TestInstallerBinaryParentContext|TestInstallerBinaryProgressCapture)$' -count=3
      - name: Vet the tagged integration and diagnostics
        run: go vet -tags=kindinstall -p 1 ./internal/installengine
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
