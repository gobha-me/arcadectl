name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-component-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guarded-runtime-validation:
    name: Guarded runtime validation and native measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test production validators and profiling boundaries
        run: go test -race -p 1 -timeout=8m ./internal/installobserve ./internal/installcontract ./hack/profile-installer-wrappers -count=1
      - name: Vet production validators and profiling boundaries
        run: go vet -p 1 ./internal/installobserve ./internal/installcontract ./hack/profile-installer-wrappers
      - name: Report bounded eligibility of all signed CRDs
        run: go test -p 1 ./internal/installcontract -run='^TestCRDShallowBorrowMatchesAllSignedSchemas$' -count=1 -v -timeout=3m
      - name: Differential fuzz production public JSON before syntax validation
        run: go test -p 1 ./internal/installobserve -run='^$' -fuzz='^FuzzPublicJSONMatchesBoundedJSON$' -fuzztime=60s -parallel=1 -timeout=3m
      - name: Differential fuzz complete CRD normalization
        run: go test -p 1 ./internal/installcontract -run='^$' -fuzz='^FuzzCRDShallowBorrowMatchesDeepCopy$' -fuzztime=30s -parallel=1 -timeout=2m
      - name: Benchmark paired whole public JSON validation
        run: go test -p 1 ./internal/installobserve -run='^$' -bench='^(BenchmarkPublicJSONValidation|BenchmarkPublicJSONRejected)$' -benchmem -benchtime=300ms -count=5 -timeout=5m
      - name: Benchmark complete signed CRD match and health checks
        run: go test -p 1 ./internal/installcontract -run='^$' -bench='^BenchmarkCRDWholeMatch$' -benchmem -benchtime=200ms -count=5 -timeout=5m
      - name: Profile one complete native component without raw artifacts
        run: go run -p 1 ./hack/profile-installer-wrappers native-component-v2 '${{ github.sha }}'
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
