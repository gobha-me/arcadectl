name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DELIVERY_SHA: b07af308b5806dc16603410d5d1d94852733c04e
  PRIOR_DELIVERY: c9cac6dead7f417e1cbd607c2138eeb575c2d111
  EXPERIMENT_BASE: dc01de4d0f10b7ee6f852bd35f37f81031f95538
  GOMAXPROCS: "2"
  GOMEMLIMIT: 1GiB
jobs:
  fixture-controls:
    name: Experimental delete and reinstall fixture controls ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [race, envtest]
    steps:
      - name: Check out source-equivalent fixture correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact delivery and test-only correction
        run: |
          set -euo pipefail
          ulimit -c 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$DELIVERY_SHA^")" = "$PRIOR_DELIVERY"
          git merge-base --is-ancestor "$EXPERIMENT_BASE" HEAD
          git merge-base --is-ancestor "$DELIVERY_SHA" HEAD
          git diff --exit-code "$PRIOR_DELIVERY" "$DELIVERY_SHA" -- . ':(exclude)internal/installengine/acknowledged_delete_preparation_test.go' ':(exclude)internal/installengine/admission_reinstall_begin_http_test.go'
          git diff --exit-code "$EXPERIMENT_BASE" HEAD -- hack/profile-installer-wrappers
          git diff --exit-code "$DELIVERY_SHA" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)hack/profile-installer-wrappers'
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} "$DELIVERY_SHA" "$DELIVERY_SHA^{tree}"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Census and run every delete and reinstall control tree
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ulimit -c 0
          case "$MODE" in
            race) set -- -race ;;
            envtest) set -- -tags=envtest ;;
            *) exit 2 ;;
          esac
          focus='^Test(AcknowledgedDelete.*|AdmissionReinstallActualBeginHTTPSPreservesSourceAndOriginals)$'
          census="$(go test "$@" -p 1 ./internal/installengine -run '^$' -list "$focus")"
          printf '%s\n' "$census"
          expected='TestAcknowledgedDeletePreparesWholeAbsenceBeforeProof
          TestAcknowledgedDeleteRejectsLateWholePodDrift
          TestAcknowledgedDeleteRejectsReplacementDuringPreparation
          TestAcknowledgedDeleteRejectsUnsignedParentDuringPreparation
          TestAcknowledgedDeleteRejectsReadRefusalDuringPreparation
          TestAcknowledgedDeleteRejectsJournalDriftDuringPreparation
          TestAcknowledgedDeleteRejectsProtectedFileFenceDuringPreparation
          TestAcknowledgedDeleteCancellationKeepsOriginalIntent
          TestAcknowledgedDeleteRejectsCollectedTargetReappearance
          TestAcknowledgedDeleteRejectsTargetReappearanceAfterFullProof
          TestAcknowledgedDeleteDiagnosticClosedFreshAndConcurrent
          TestAcknowledgedDeleteDiagnosticActualEarlyRefusals
          TestAdmissionReinstallActualBeginHTTPSPreservesSourceAndOriginals'
          test "$(printf '%s\n' "$census" | awk '/^Test[A-Za-z0-9_]+$/ {n++} END {print n}')" = 13
          while IFS= read -r root; do
            test "$(printf '%s\n' "$census" | grep -Fxc "$root")" = 1
          done <<< "$expected"
          printf '%s\n' 'Validated fixture roots: 13'
          go test "$@" -p 1 -timeout=20m ./internal/installengine -run "$focus" -count=1 -v
          test -z "$(git status --porcelain)"
          git diff --exit-code "$DELIVERY_SHA" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)hack/profile-installer-wrappers'

