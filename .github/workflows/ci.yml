name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-pipeline-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-pipeline-integration:
    name: Request pipeline integrated diagnostic controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      GOTOOLCHAIN: local
      GOTELEMETRY: off
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test actual request boundaries and fixture invariants
        run: |
          go test -race -p 1 -timeout=10m ./internal/installengine -run='^TestRequestPipeline' -count=3
          printf '%s\n' 'arcadectl-request-pipeline-integrated-race-v1-complete'
      - name: Race test the actual CLI output boundary
        run: |
          go test -race -p 1 -timeout=5m ./cmd/arcadectl-installer -count=1
          printf '%s\n' 'arcadectl-request-pipeline-integrated-cli-v1-complete'
      - name: Race test tagged live capture and parent diagnostic controls
        run: |
          go test -race -tags=kindinstall -p 1 -timeout=5m ./internal/installengine -run='^TestInstallerBinary(ProgressCapture|RequestPipelineCapture|ParentContext)$' -count=3
          printf '%s\n' 'arcadectl-request-pipeline-integrated-capture-v1-complete'
      - name: Vet the tagged engine and CLI
        run: |
          go vet -tags=kindinstall -p 1 ./internal/installengine ./cmd/arcadectl-installer
          printf '%s\n' 'arcadectl-request-pipeline-integrated-vet-v1-complete'
      - name: Require unchanged exact source checkout
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=normal)"
