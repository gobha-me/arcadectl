# Diff ratchet for #114. Deliberately contains no baseline exclusions.
# source-baseline: 0225dc4a1da171b3aa07028ab8e94e7e77ea8cf5
version: "2"

run:
  timeout: 15m
  concurrency: 2
  relative-path-mode: cfg

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
