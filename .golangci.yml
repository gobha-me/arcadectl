# Wave 0 baseline for #96. Remove exclusions as findings are fixed.
# Source anchors narrow exclusions to baselined line text (ignoring outer whitespace).
# New findings on different line text are reported; byte-identical new lines in the
# same file with the same finding remain masked because no line anchor is available.
# Burn down the baseline or use issues.new-from-merge-base; the latter needs a CI
# checkout change owned by the CI workstream.
# See docs/golangci-ratchet.md for the inventory and maintenance procedure.
version: "2"

run:
  timeout: 15m
  concurrency: 2
  relative-path-mode: cfg

linters:
